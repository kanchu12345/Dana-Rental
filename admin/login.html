<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Danan Car & Bike Rentals</title>
  <link rel="icon" href="../assets/images/logo/logo.png" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <img src="../assets/images/logo/logo.png" alt="Danan Logo" class="login-logo">
      <h2 class="login-title">Danan Admin</h2>
      <p class="login-subtitle">Sign in to manage website content & vehicle fleet</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="adminEmail">Email Address</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="admin@dananrentals.com" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 8px;">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="text-align: right; margin-bottom: 16px;">
        <a href="#" id="btnForgotPassword" style="font-size: 0.78rem; color: #666; text-decoration: underline;">Forgot Password?</a>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-primary" style="width: 100%; margin-top: 4px; background-color: var(--primary-red); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">
        Sign In with Email
      </button>

      <div style="display: flex; align-items: center; margin: 16px 0; gap: 10px;">
        <hr style="flex: 1; border: none; border-top: 1px solid #E0E0E0;">
        <span style="font-size: 0.8rem; color: #888888; font-weight: 600;">OR</span>
        <hr style="flex: 1; border: none; border-top: 1px solid #E0E0E0;">
      </div>

      <button type="button" id="btnGoogleLogin" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #FFFFFF; color: #333333; padding: 11px; border: 1px solid #CCCCCC; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Sign In with Google
      </button>

      <div id="demoNotice" style="margin-top: 20px; font-size: 0.8rem; color: #888888; text-align: center; background-color: #F8F8F8; padding: 10px; border-radius: 6px;">
        💡 <strong>Admin Portal:</strong> Use your registered administrator credentials to access the panel.
      </div>
    </form>
  </div>

  <script type="module">
    import { initFirebase, auth } from '../js/db.js';
    import { showToast } from '../js/admin.js';

    let activeAuth = null;

    // Check existing auth state on load
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { auth: fbAuth } = await initFirebase();
        activeAuth = fbAuth || auth;

        if (activeAuth) {
          const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
          onAuthStateChanged(activeAuth, (user) => {
            if (user) {
              window.location.replace('./index.html');
            }
          });
        }
      } catch (e) {
        console.warn("Auth initialization notice:", e);
      }
    });

    function formatAuthError(err) {
      if (!err || !err.code) return err.message || "Authentication failed.";
      switch (err.code) {
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          return "Invalid email address or password.";
        case 'auth/invalid-email':
          return "Please enter a valid email address.";
        case 'auth/user-disabled':
          return "This administrator account has been disabled.";
        case 'auth/too-many-requests':
          return "Too many failed attempts. Please wait a few minutes and try again.";
        case 'auth/popup-closed-by-user':
          return "Google Sign-In popup was closed before completion.";
        case 'auth/network-request-failed':
          return "Network error. Please check your internet connection.";
        default:
          return err.message;
      }
    }

    // Email/Password login handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const btn = document.getElementById('btnLoginSubmit');

      if (!email || !password) {
        showToast("Please enter both email and password.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verifying...";

      try {
        if (!activeAuth) {
          const { auth: fbAuth } = await initFirebase();
          activeAuth = fbAuth || auth;
        }

        if (!activeAuth) {
          throw new Error("Firebase Auth service is unavailable.");
        }

        const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
        await signInWithEmailAndPassword(activeAuth, email, password);
        showToast("Login successful!", "success");
        setTimeout(() => {
          window.location.replace('./index.html');
        }, 500);
      } catch (err) {
        showToast("Login failed: " + formatAuthError(err), "error");
        btn.disabled = false;
        btn.textContent = "Sign In with Email";
      }
    });

    // Google Sign-In handler
    document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
      const btn = document.getElementById('btnGoogleLogin');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        if (!activeAuth) {
          const { auth: fbAuth } = await initFirebase();
          activeAuth = fbAuth || auth;
        }

        if (!activeAuth) {
          throw new Error("Firebase Auth service is unavailable.");
        }

        const { GoogleAuthProvider, signInWithPopup } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
        const provider = new GoogleAuthProvider();
        await signInWithPopup(activeAuth, provider);
        showToast("Signed in with Google successfully!", "success");
        setTimeout(() => {
          window.location.replace('./index.html');
        }, 500);
      } catch (err) {
        showToast("Google Sign-In failed: " + formatAuthError(err), "error");
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });

    // Password Reset handler
    document.getElementById('btnForgotPassword')?.addEventListener('click', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('adminEmail').value.trim();
      const email = emailInput || prompt("Enter your administrator email to receive a password reset link:");
      if (!email) return;

      try {
        if (!activeAuth) {
          const { auth: fbAuth } = await initFirebase();
          activeAuth = fbAuth || auth;
        }
        const { sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
        await sendPasswordResetEmail(activeAuth, email);
        showToast("Password reset email sent to " + email + ". Check your inbox!", "success");
      } catch (err) {
        showToast("Password reset failed: " + formatAuthError(err), "error");
      }
    });
  </script>
</body>
</html>
